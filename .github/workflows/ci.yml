name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PEPTIMUS_APP_ID }}
          private-key: ${{ secrets.PEPTIMUS_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json valid')"

      - name: Validate tsconfig.json
        run: node -e "JSON.parse(require('fs').readFileSync('tsconfig.json','utf8')); console.log('tsconfig.json valid')"

      - name: Check source structure
        run: |
          [ -d "src" ] && echo "src/ present" || (echo "src/ missing" && exit 1)
          [ -f "src/index.ts" ] && echo "src/index.ts present" || (echo "src/index.ts missing" && exit 1)
          [ -f "src/app.ts" ] && echo "src/app.ts present" || (echo "src/app.ts missing" && exit 1)
          [ -f "build.mjs" ] && echo "build.mjs present" || (echo "build.mjs missing" && exit 1)

      - name: Check no Replit artifacts
        run: |
          if grep -rI "@replit\|REPL_ID\|REPLIT" --include="*.ts" --include="*.js" --include="*.json" --exclude-dir=".github" . 2>/dev/null; then
            echo "Replit artifacts found" && exit 1
          fi
          echo "Clean - no Replit artifacts"
